<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SkillsHub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: filter rail on the left, skill index on the right; stacks to one column on phones. */
:root {
  --bg: #f2f4f1;
  --surface: #ffffff;
  --fg: #1c2421;
  --muted: #5b6863;
  --line: #d8ddd8;
  --accent: #0e7a6a;
  --accent-soft: #dcefe9;
  --mark: #fbe9a6;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111614; --surface: #19201d; --fg: #e3e9e6; --muted: #93a19b; --line: #2a3330;
    --accent: #43c2ab; --accent-soft: #173a33; --mark: #5a4a12; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111614; --surface: #19201d; --fg: #e3e9e6; --muted: #93a19b; --line: #2a3330;
  --accent: #43c2ab; --accent-soft: #173a33; --mark: #5a4a12; color-scheme: dark;
}
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 15px/1.55 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 56px;
}
[hidden] { display: none !important; }
.wrap { max-width: 1120px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code, .mono { font-family: var(--font-mono); }

/* Header */
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; }
.brand h1 { margin: 0; font: 600 1.75rem/1.1 var(--font-mono); letter-spacing: -0.02em; }
.brand h1 span { color: var(--accent); }
.brand p { margin: 6px 0 0; color: var(--muted); font-size: 0.9rem; }
.cmd {
  display: flex; align-items: center; gap: 8px; min-width: 0; max-width: 100%;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 6px 6px 6px 12px; font: 0.82rem var(--font-mono);
}
.cmd code { overflow-x: auto; white-space: nowrap; min-width: 0; }
.copy {
  flex: none; border: 1px solid var(--line); background: var(--bg); border-radius: 4px;
  padding: 3px 10px; font: 500 0.75rem var(--font-body); cursor: pointer;
}
.copy:hover { border-color: var(--accent); color: var(--accent); }
.copy.done { background: var(--accent); border-color: var(--accent); color: var(--surface); }

/* Search */
.search { position: relative; }
.search input {
  width: 100%; padding: 14px 44px 14px 16px; font-size: 1.05rem;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
}
.search input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.search kbd {
  position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
  font: 0.75rem var(--font-mono); color: var(--muted); border: 1px solid var(--line);
  border-radius: 4px; padding: 1px 7px; background: var(--bg);
}

/* Main grid */
.main { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 32px; align-items: start; }
@media (max-width: 760px) { .main { grid-template-columns: minmax(0, 1fr); gap: 20px; } }

/* Filters */
aside, #tag-groups { display: grid; gap: 20px; min-width: 0; }
@media (min-width: 761px) { aside { position: sticky; top: calc(16px + env(safe-area-inset-top, 0px)); } }
.fgroup h2 {
  margin: 0 0 8px; font: 600 0.7rem var(--font-body); text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--muted);
}
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 2px 10px; font: 0.8rem var(--font-mono); line-height: 1.6;
}
.chip .n { color: var(--muted); font-size: 0.72rem; font-variant-numeric: tabular-nums; }
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.chip[aria-pressed="true"] .n { color: inherit; opacity: 0.8; }
.chip:disabled { opacity: 0.4; cursor: default; border-color: var(--line); }
.filters-toggle { display: none; }
@media (max-width: 760px) {
  .filters-toggle {
    display: flex; justify-content: space-between; align-items: center; width: 100%;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 10px 14px; cursor: pointer; font-weight: 500;
  }
  aside.collapsed .fgroup { display: none; }
}

/* Results */
.status { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; color: var(--muted); font-size: 0.88rem; }
.status strong { color: var(--fg); font-variant-numeric: tabular-nums; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; font-size: 0.88rem; }
.list { display: grid; gap: 12px; }
.skill {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 18px 20px; display: grid; gap: 10px; min-width: 0;
}
.skill-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
.skill-head h3 { margin: 0; font: 600 1.08rem var(--font-mono); }
.meta { display: flex; flex-wrap: wrap; gap: 6px 12px; color: var(--muted); font-size: 0.8rem; }
.meta .plugin { font-family: var(--font-mono); }
.meta .cat { color: var(--accent); font-weight: 500; }
.summary { margin: 0; max-width: 68ch; }
.skill .chips .chip { font-size: 0.74rem; padding: 0 8px; }
mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }
.row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
details.more { flex: 1 1 auto; min-width: 0; }
details.more[open] { flex-basis: 100%; order: 2; }
details.more summary { cursor: pointer; color: var(--muted); font-size: 0.85rem; width: max-content; }
details.more summary:hover { color: var(--accent); }
.detail { display: grid; gap: 12px; padding-top: 10px; font-size: 0.9rem; }
.detail p { margin: 0; max-width: 72ch; }
.detail dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 14px; margin: 0; }
.detail dt { color: var(--muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; padding-top: 2px; }
.detail dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.detail a { color: var(--accent); }
.empty { border: 1px dashed var(--line); border-radius: var(--radius); padding: 32px 20px; text-align: center; color: var(--muted); }
footer { color: var(--muted); font-size: 0.8rem; }
footer code { font-size: 0.78rem; }
@media (prefers-reduced-motion: no-preference) { .chip, .copy { transition: background-color .12s, border-color .12s, color .12s; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>Skills<span>Hub</span></h1>
      <p id="tagline">Loading catalog…</p>
    </div>
    <div class="cmd"><code id="add-cmd">/plugin marketplace add</code><button class="copy" type="button" data-copy-from="add-cmd">Copy</button></div>
  </header>

  <div class="search">
    <input id="q" type="search" aria-label="Search skills" placeholder="Search skills, e.g. “mermaid”, “pull request”, “isometric”" autocomplete="off" spellcheck="false">
    <kbd aria-hidden="true">/</kbd>
  </div>

  <div class="main">
    <aside id="filters" class="collapsed">
      <button class="filters-toggle" type="button" id="filters-toggle" aria-expanded="false">Filters <span id="filters-count" class="mono"></span></button>
      <div class="fgroup">
        <h2>Plugin</h2>
        <div class="chips" id="plugin-chips"></div>
      </div>
      <div id="tag-groups"></div>
    </aside>

    <section aria-live="polite">
      <div class="status">
        <span id="count"></span>
        <button class="linkbtn" type="button" id="clear" hidden>Clear search and filters</button>
      </div>
      <div class="list" id="list"></div>
      <div class="empty" id="empty" hidden>
        <p>No skills match. Try fewer tags or a broader word.</p>
        <button class="linkbtn" type="button" id="clear2">Clear search and filters</button>
      </div>
    </section>
  </div>

  <footer>Generated from <code>catalog/skills.json</code> and each plugin's <code>SKILL.md</code>. Rebuild with <code>node scripts/build-catalog.mjs</code>.</footer>
</div>

<script src="catalog.js"></script>
<script>
(function () {
  const C = window.SKILLS_CATALOG;
  const $ = (id) => document.getElementById(id);
  if (!C) { $('tagline').textContent = 'catalog.js not found. Run node scripts/build-catalog.mjs.'; return; }

  const state = { q: '', plugin: null, tags: new Set() };
  const plugins = Object.fromEntries(C.plugins.map((p) => [p.name, p]));
  const repoUrl = `https://github.com/${C.repo}`;

  $('tagline').textContent = `${C.skills.length} skills in ${C.plugins.length} plugins · marketplace “${C.marketplace}”`;
  $('add-cmd').textContent = `/plugin marketplace add ${C.repo}`;

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const terms = () => state.q.toLowerCase().split(/\s+/).filter(Boolean);
  const norm = (s) => s.toLowerCase().replace(/[-_]/g, ' ');

  function highlight(text, ts) {
    let html = esc(text);
    if (!ts.length) return html;
    const re = new RegExp('(' + ts.map((t) => esc(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi');
    return html.replace(re, '<mark>$1</mark>');
  }

  // Each term must match somewhere; matches in name and tags rank above matches in prose.
  function score(s, ts) {
    if (!ts.length) return 1;
    const fields = [
      [norm(s.name), 6], [s.tags.map(norm).join(' '), 4], [norm(s.plugin + ' ' + s.category), 3],
      [s.summary.toLowerCase(), 2], [(s.description + ' ' + (s.example || '')).toLowerCase(), 1],
    ];
    let total = 0;
    for (const raw of ts) {
      const t = norm(raw);
      let best = 0;
      for (const [text, w] of fields) if (text.includes(t)) best = Math.max(best, w);
      if (!best) return 0;
      total += best;
    }
    return total;
  }

  const matchesFilters = (s, ignore) =>
    (ignore === 'plugin' || !state.plugin || s.plugin === state.plugin) &&
    (ignore === 'tags' || [...state.tags].every((t) => s.tags.includes(t)));

  function chip(label, count, pressed, onClick, disabled) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip';
    b.setAttribute('aria-pressed', pressed ? 'true' : 'false');
    b.innerHTML = `${esc(label)}${count != null ? ` <span class="n">${count}</span>` : ''}`;
    b.disabled = !!disabled && !pressed;
    b.addEventListener('click', onClick);
    return b;
  }

  function toggleTag(t) { state.tags.has(t) ? state.tags.delete(t) : state.tags.add(t); render(); }

  function render() {
    const ts = terms();
    const searched = C.skills.map((s) => ({ s, sc: score(s, ts) })).filter((x) => x.sc > 0);
    const results = searched.filter((x) => matchesFilters(x.s)).sort((a, b) =>
      b.sc - a.sc || a.s.name.localeCompare(b.s.name)).map((x) => x.s);

    // Plugin facet counts ignore the plugin filter itself.
    const pc = $('plugin-chips'); pc.replaceChildren();
    const forPlugins = searched.filter((x) => matchesFilters(x.s, 'plugin'));
    pc.append(chip('all', forPlugins.length, !state.plugin, () => { state.plugin = null; render(); }));
    for (const p of C.plugins) {
      const n = forPlugins.filter((x) => x.s.plugin === p.name).length;
      pc.append(chip(p.name, n, state.plugin === p.name, () => { state.plugin = state.plugin === p.name ? null : p.name; render(); }, n === 0));
    }

    // Tag facet counts: how many current results also carry each tag.
    const tg = $('tag-groups'); tg.replaceChildren();
    for (const [group, tags] of Object.entries(C.tagGroups)) {
      const g = document.createElement('div'); g.className = 'fgroup';
      g.innerHTML = `<h2>${esc(group)}</h2>`;
      const box = document.createElement('div'); box.className = 'chips';
      for (const t of tags) {
        const n = results.filter((s) => s.tags.includes(t)).length;
        box.append(chip(t, n, state.tags.has(t), () => toggleTag(t), n === 0));
      }
      g.append(box); tg.append(g);
    }

    const active = (state.plugin ? 1 : 0) + state.tags.size;
    $('filters-count').textContent = active ? `${active} active` : '';
    $('clear').hidden = !(active || ts.length);
    $('count').innerHTML = `<strong>${results.length}</strong> of ${C.skills.length} skills`;
    $('empty').hidden = results.length > 0;

    const list = $('list'); list.replaceChildren();
    for (const s of results) list.append(card(s, ts));
  }

  function card(s, ts) {
    const p = plugins[s.plugin];
    const el = document.createElement('article'); el.className = 'skill';
    const install = p.install;
    const cmdId = `cmd-${s.name}`;
    el.innerHTML = `
      <div class="skill-head">
        <h3>${highlight(s.name, ts)}</h3>
        <div class="meta"><span class="cat">${esc(s.category)}</span><span class="plugin">plugin: ${esc(s.plugin)}</span>${p.license ? `<span>${esc(p.license)}</span>` : ''}</div>
      </div>
      <p class="summary">${highlight(s.summary, ts)}</p>
      <div class="chips tags"></div>
      <div class="row">
        <details class="more"><summary>Details</summary></details>
        <div class="cmd"><code id="${esc(cmdId)}">${esc(install)}</code><button class="copy" type="button" data-copy-from="${esc(cmdId)}">Copy</button></div>
      </div>`;
    const tagBox = el.querySelector('.tags');
    for (const t of s.tags) tagBox.append(chip(t, null, state.tags.has(t), () => toggleTag(t)));

    const d = document.createElement('div'); d.className = 'detail';
    const rows = [];
    if (s.example) rows.push(['Try', `<code>${esc(s.example)}</code>`]);
    if (s.argumentHint) rows.push(['Args', `<code>/${esc(s.name)} ${esc(s.argumentHint)}</code>`]);
    if (s.requires.length) rows.push(['Requires', s.requires.map((r) => `<code>${esc(r)}</code>`).join(', ')]);
    if (p.commands.length) rows.push(['Commands', p.commands.map((c) => `<code>/${esc(c)}</code>`).join(' ')]);
    rows.push(['Source', `<a href="${repoUrl}/blob/${esc(C.branch)}/${esc(s.path)}" target="_blank" rel="noopener">${esc(s.path)}</a>`]);
    if (p.upstream) rows.push(['Upstream', `<a href="${esc(p.upstream)}" target="_blank" rel="noopener">${esc(p.upstream.replace('https://github.com/', ''))}</a>${p.version ? ` · v${esc(p.version)}` : ''}`]);
    d.innerHTML = `<p>${highlight(s.description, ts)}</p><dl>${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`;
    el.querySelector('details').append(d);
    return el;
  }

  function clearAll() { state.q = ''; state.plugin = null; state.tags.clear(); $('q').value = ''; render(); $('q').focus(); }

  $('q').addEventListener('input', (e) => { state.q = e.target.value; render(); });
  $('q').addEventListener('keydown', (e) => { if (e.key === 'Escape') { e.target.value = ''; state.q = ''; render(); } });
  document.addEventListener('keydown', (e) => {
    if (e.key === '/' && document.activeElement !== $('q') && !e.metaKey && !e.ctrlKey) { e.preventDefault(); $('q').focus(); }
  });
  $('clear').addEventListener('click', clearAll);
  $('clear2').addEventListener('click', clearAll);
  $('filters-toggle').addEventListener('click', () => {
    const f = $('filters'); const collapsed = f.classList.toggle('collapsed');
    $('filters-toggle').setAttribute('aria-expanded', String(!collapsed));
  });

  document.addEventListener('click', async (e) => {
    const btn = e.target.closest('.copy'); if (!btn) return;
    const src = $(btn.dataset.copyFrom); const text = src.textContent;
    try { await navigator.clipboard.writeText(text); }
    catch { const r = document.createRange(); r.selectNodeContents(src); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); btn.textContent = 'Press ⌘C'; return; }
    btn.textContent = 'Copied'; btn.classList.add('done');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('done'); }, 1400);
  });

  render();
})();
</script>
</body>
</html>
